<!-- KI-Beitrag (Claude, GB-7), 23.11.2026 – Strang G3 „Aufbau: ein Kern, drei Hüllen“, ENTWURF, Freigabe durch Kenny Looser ausstehend (GB-8). -->
<!-- Inhalt nach STUDIO-MASTERPLAN.md §3 und core/STAND.md. Farben nach CAELUM/DESIGN.md, Purpur #C8479A. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="titel beschr">
  <title id="titel">Caelum Motion Studio – ein Kern, drei Hüllen</title>
  <desc id="beschr">Der Klang-Kern caelum-motion-core in C++ enthält Effekte, EQ, Synth-Bausteine, Takt, Zuordnung und Looper. Drei Hüllen nutzen ihn: die Handy-App über JNI und AAudio, die VST3-Plugins über JUCE und das Web-Studio über WebAssembly. Ein Gleichheitstest prüft, dass alle drei gleich klingen.</desc>
  <defs>
    <style>
      .bg { fill: #262624; }
      .card { fill: #30302E; stroke: #3D3D3A; stroke-width: 1.5; }
      .well { fill: #1F1E1D; stroke: #3D3D3A; stroke-width: 1.5; }
      .haupt { fill: #30302E; stroke: #C8479A; stroke-width: 2.5; }
      .chip { fill: #1F1E1D; stroke: #3D3D3A; stroke-width: 1.2; }
      .h { fill: #E8E6E1; font-size: 26px; font-weight: 600; }
      .sub { fill: #9C9A94; font-size: 15px; }
      .tg { fill: #E8E6E1; font-size: 21px; font-weight: 600; }
      .t { fill: #E8E6E1; font-size: 17px; font-weight: 600; }
      .s { fill: #C9C6BF; font-size: 13.5px; }
      .c { fill: #C9C6BF; font-size: 12.5px; }
      .m { fill: #9C9A94; font-size: 12px; }
      .mono { fill: #9C9A94; font-size: 12px; font-family: 'Cascadia Mono', Consolas, monospace; }
      .f { fill: #6E6C66; font-size: 11.5px; }
      .labA { fill: #C8479A; font-size: 12px; font-weight: 600; }
      .okT { fill: #6BAF73; font-size: 13px; font-weight: 600; }
      .ok { fill: #6BAF73; }
      .nr { fill: #C8479A; }
      .nrT { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
      .ic { fill: none; stroke: #C9C6BF; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
      .p { fill: none; stroke: #C9C6BF; stroke-width: 2; marker-end: url(#mk); }
      .pA { fill: none; stroke: #C8479A; stroke-width: 3; marker-end: url(#mkA); }
      .gl { fill: none; stroke: #6BAF73; stroke-width: 1.8; stroke-dasharray: 4 4; }
      .mk { fill: #C9C6BF; }
      .mkA { fill: #C8479A; }
      .puls { fill: #C8479A; }
      .zeiger { fill: #C8479A; stroke: #262624; stroke-width: 3; }
      .kopf { stroke: #C8479A; stroke-width: 1.5; opacity: 0.75; }
      @media (prefers-reduced-motion: reduce) { .bewegt { display: none; } }
      /* Webseite caelum.one: immer dunkel wie die Seite (Hell-Block entfernt) */
    </style>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
    <marker id="mkA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mkA"/>
    </marker>
  </defs>

  <rect width="1200" height="660" rx="16" class="bg"/>
  <text x="40" y="54" class="h">Ein Kern, drei Hüllen</text>
  <text x="40" y="80" class="sub">Der Klang wird einmal in C++ gebaut und klingt gleich im Handy, in Ableton und im Browser.</text>

  <!-- Vorlage links -->
  <rect x="40" y="124" width="170" height="104" rx="12" class="card"/>
  <text x="56" y="152" class="t">Vorlage</text>
  <text x="56" y="176" class="s">Effekte.java</text>
  <text x="56" y="196" class="m">aus der Handy-App,</text>
  <text x="56" y="213" class="m">in C++ übertragen</text>
  <path d="M212,176 L246,176" class="p"/>

  <!-- Kern -->
  <rect x="250" y="110" width="700" height="150" rx="12" class="haupt"/>
  <text x="270" y="144" class="tg">caelum-motion-core</text>
  <text x="270" y="166" class="m">C++ · ohne JUCE · ohne fremde Pakete</text>
  <text x="930" y="144" text-anchor="end" class="mono">cm_process(links, rechts, frames)</text>
  <g>
    <rect x="268" y="184" width="90" height="32" rx="8" class="chip"/>
    <text x="313" y="205" text-anchor="middle" class="c">Effekte (20)</text>
    <rect x="366" y="184" width="104" height="32" rx="8" class="chip"/>
    <text x="418" y="205" text-anchor="middle" class="c">EQ (8 Bänder)</text>
    <rect x="478" y="184" width="118" height="32" rx="8" class="chip"/>
    <text x="537" y="205" text-anchor="middle" class="c">Klang 808 (16)</text>
    <rect x="604" y="184" width="100" height="32" rx="8" class="chip"/>
    <text x="654" y="205" text-anchor="middle" class="c">Takt und Uhr</text>
    <rect x="712" y="184" width="132" height="32" rx="8" class="chip"/>
    <text x="778" y="205" text-anchor="middle" class="c">Zuordnung, Glätten</text>
    <rect x="852" y="184" width="78" height="32" rx="8" class="chip"/>
    <text x="891" y="205" text-anchor="middle" class="c">Looper</text>
  </g>
  <text x="270" y="243" class="m">keine Speicherzuteilung im Audio-Faden · Parameter als Nummer und Wert · ein Quelltext für alle</text>

  <!-- Prüfung rechts -->
  <rect x="990" y="124" width="170" height="104" rx="12" class="card"/>
  <text x="1006" y="152" class="t">Prüfung</text>
  <circle cx="1011" cy="172" r="4.5" class="ok"/>
  <text x="1022" y="177" class="okT">82/82 grün</text>
  <text x="1006" y="196" class="m">Java ↔ C++ bitgleich,</text>
  <text x="1006" y="213" class="m">Stand Kern 0.3.0</text>
  <path d="M952,176 L986,176" class="p"/>

  <!-- Anschlüsse an die Hüllen -->
  <path d="M330,262 V292 H210 V324" class="pA"/>
  <path d="M600,262 V324" class="pA"/>
  <path d="M870,262 V292 H990 V324" class="pA"/>
  <text x="222" y="316" class="labA">JNI + AAudio</text>
  <text x="612" y="300" class="labA">JUCE, nur die Hülle</text>
  <text x="978" y="316" text-anchor="end" class="labA">WebAssembly + AudioWorklet</text>

  <!-- ① Handy-App -->
  <rect x="40" y="330" width="340" height="150" rx="12" class="card"/>
  <circle cx="64" cy="358" r="13" class="nr"/><text x="64" y="363" text-anchor="middle" class="nrT">1</text>
  <text x="88" y="364" class="t">Handy-App „Player“</text>
  <rect x="344" y="346" width="18" height="30" rx="4" class="ic"/>
  <text x="58" y="390" class="m">Android · eigene Oberfläche in Java</text>
  <text x="58" y="414" class="s">Effekte auf alle Apps am Handy</text>
  <text x="58" y="434" class="s">Looper, Sequenzer, Drum</text>
  <text x="58" y="462" class="m">Anschluss Strang A3, nach Tor P2</text>

  <!-- ② VST3 -->
  <rect x="430" y="330" width="340" height="150" rx="12" class="card"/>
  <circle cx="454" cy="358" r="13" class="nr"/><text x="454" y="363" text-anchor="middle" class="nrT">2</text>
  <text x="478" y="364" class="t">VST3-Plugins</text>
  <circle cx="742" cy="361" r="13" class="ic"/>
  <line x1="742" y1="361" x2="749" y2="352" class="ic"/>
  <text x="448" y="390" class="m">Ableton Live und andere DAWs</text>
  <text x="448" y="414" class="s">Motion Steuer · Motion EQ</text>
  <text x="448" y="434" class="s">Motion Synth</text>
  <text x="448" y="462" class="m">Strang C, Phase P3</text>

  <!-- ③ Web-Studio -->
  <rect x="820" y="330" width="340" height="150" rx="12" class="card"/>
  <circle cx="844" cy="358" r="13" class="nr"/><text x="844" y="363" text-anchor="middle" class="nrT">3</text>
  <text x="868" y="364" class="t">Web-Studio</text>
  <rect x="1116" y="349" width="28" height="22" rx="3" class="ic"/>
  <line x1="1116" y1="355" x2="1144" y2="355" class="ic"/>
  <text x="838" y="390" class="m">Browser, ohne Installation</text>
  <text x="838" y="414" class="s">Mitspielen in der Caelum Station</text>
  <text x="838" y="434" class="s">Handy als Controller im Browser</text>
  <text x="838" y="462" class="m">Strang E, Phase P5</text>

  <!-- Gleichheitstest -->
  <path d="M210,482 V512" class="gl"/>
  <path d="M600,482 V512" class="gl"/>
  <path d="M990,482 V512" class="gl"/>
  <rect x="40" y="512" width="1120" height="74" rx="12" class="well"/>
  <circle cx="62" cy="539" r="5" class="ok"/>
  <text x="76" y="544" class="okT">Gleichheitstest</text>
  <text x="196" y="544" class="s">Gleiche Eingabe ergibt in allen drei Hüllen die gleiche Ausgabe (mit Toleranz). Diese Prüfung hält alles zusammen.</text>
  <text x="76" y="568" class="m">Heute: Effekte, EQ und Klang 808 Java ↔ C++ bitgleich, Hörprobe in allen 21 Abschnitten gleich. Danach dieselbe Prüfung in jeder Hülle.</text>

  <text x="40" y="618" class="m">Fundament selbst, Hülle getauscht (STANDARD §8): JUCE nur für VST3, auf Android AAudio direkt. Ableton ist Gast, nicht Pflicht.</text>
  <text x="40" y="640" class="f">Entwurf 23.11.2026 · Caelum GmbH · nach STUDIO-MASTERPLAN.md §3 und core/STAND.md</text>
  <!-- Bewegung (Web): alle 4 s fliesst ein Impuls aus dem Kern gleichzeitig in alle drei Hüllen -->
  <g class="bewegt">
    <circle r="4.5" class="puls" opacity="0">
      <animateMotion path="M330,262 V292 H210 V320" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.29;0.3;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" class="puls" opacity="0">
      <animateMotion path="M600,262 V320" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.29;0.3;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" class="puls" opacity="0">
      <animateMotion path="M870,262 V292 H990 V320" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.29;0.3;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
