<!-- Copyright © 2026 Caelum GmbH, Kenny Looser. Alle Rechte vorbehalten. -->
<!-- KI-Beitrag (Claude, GB-7), 23.11.2026 – Strang G2 „Jam-Runde“, ENTWURF, Freigabe durch Kenny Looser ausstehend (GB-8). -->
<!-- Inhalt nach station/ENTWURF.md §1, §2, §12 und radio/ENTWURF.md §3. Farben nach CAELUM/DESIGN.md, Purpur #C8479A. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="titel beschr">
  <title id="titel">Caelum Station – Ablauf einer Jam-Runde</title>
  <desc id="beschr">Zeitstrahl über vier Runden zu je 8 Sekunden. Was ein Mitspieler in Runde n spielt, mischt die Station am Ende der Runde und alle hören es in Runde n+1. Das Grundmuster läuft immer im Hintergrund. Hörer im Radio liegen eine Runde plus etwa 2 Sekunden zurück.</desc>
  <defs>
    <style>
      .bg { fill: #262624; }
      .card { fill: #30302E; stroke: #3D3D3A; stroke-width: 1.5; }
      .well { fill: #1F1E1D; stroke: #3D3D3A; stroke-width: 1.5; }
      .accF { fill: #C8479A; }
      .h { fill: #E8E6E1; font-size: 26px; font-weight: 600; }
      .sub { fill: #9C9A94; font-size: 15px; }
      .t { fill: #E8E6E1; font-size: 15px; font-weight: 600; }
      .tA { fill: #C8479A; font-size: 15px; font-weight: 600; }
      .s { fill: #C9C6BF; font-size: 13.5px; }
      .m { fill: #9C9A94; font-size: 12px; }
      .f { fill: #6E6C66; font-size: 11.5px; }
      .lab { fill: #9C9A94; font-size: 11px; }
      .labA { fill: #C8479A; font-size: 11px; font-weight: 600; }
      .nr { fill: #C8479A; }
      .nrT { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
      .grenze { stroke: #3D3D3A; stroke-width: 1.5; stroke-dasharray: 3 5; }
      .achse { stroke: #9C9A94; stroke-width: 1.5; fill: none; marker-end: url(#mk); }
      .tick { stroke: #6E6C66; stroke-width: 1.5; }
      .tickR { stroke: #9C9A94; stroke-width: 2; }
      .dot { fill: #6E6C66; }
      .dotA { fill: #9C9A94; }
      .leise { opacity: 0.45; }
      .p { fill: none; stroke: #C9C6BF; stroke-width: 2; marker-end: url(#mk); }
      .pg { fill: none; stroke: #9C9A94; stroke-width: 1.8; stroke-dasharray: 5 4; marker-end: url(#mk); }
      .pA { fill: none; stroke: #C8479A; stroke-width: 2.5; marker-end: url(#mkA); }
      .mk { fill: #C9C6BF; }
      .mkA { fill: #C8479A; }
      .puls { fill: #C8479A; }
      .zeiger { fill: #C8479A; stroke: #262624; stroke-width: 3; }
      .kopf { stroke: #C8479A; stroke-width: 1.5; opacity: 0.75; }
      @media (prefers-reduced-motion: reduce) { .bewegt { display: none; } }
      /* Webseite caelum.one: immer dunkel wie die Seite (Hell-Block entfernt) */
    </style>
    <marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mk"/>
    </marker>
    <marker id="mkA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="mkA"/>
    </marker>
    <!-- 16 Schritte je Runde (225 px), betonter Schlag je Viertel-Takt -->
    <pattern id="schritte" patternUnits="userSpaceOnUse" x="260" y="150" width="56.25" height="32">
      <circle cx="7" cy="16" r="3.4" class="dotA"/>
      <circle cx="21.06" cy="16" r="2.2" class="dot"/>
      <circle cx="35.12" cy="16" r="2.2" class="dot"/>
      <circle cx="49.19" cy="16" r="2.2" class="dot"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" rx="16" class="bg"/>
  <text x="40" y="54" class="h">Eine Jam-Runde in der Caelum Station</text>
  <text x="40" y="80" class="sub">Was du in Runde n spielst, hören alle in Runde n+1 – und spielen dazu. Eine Runde = 4 Takte = 8 s bei 120 BPM.</text>

  <!-- Zeitachse und Runden -->
  <text x="372.5" y="118" text-anchor="middle" class="t">Runde n−1</text>
  <text x="597.5" y="118" text-anchor="middle" class="tA">Runde n</text>
  <text x="822.5" y="118" text-anchor="middle" class="t">Runde n+1</text>
  <text x="1047.5" y="118" text-anchor="middle" class="t">Runde n+2</text>
  <line x1="260" y1="134" x2="1168" y2="134" class="achse"/>
  <text x="40" y="138" class="m">Zeit · 4 Takte je Runde</text>
  <g>
    <line x1="260" y1="127" x2="260" y2="141" class="tickR"/>
    <line x1="316.25" y1="130" x2="316.25" y2="138" class="tick"/>
    <line x1="372.5" y1="130" x2="372.5" y2="138" class="tick"/>
    <line x1="428.75" y1="130" x2="428.75" y2="138" class="tick"/>
    <line x1="485" y1="127" x2="485" y2="141" class="tickR"/>
    <line x1="541.25" y1="130" x2="541.25" y2="138" class="tick"/>
    <line x1="597.5" y1="130" x2="597.5" y2="138" class="tick"/>
    <line x1="653.75" y1="130" x2="653.75" y2="138" class="tick"/>
    <line x1="710" y1="127" x2="710" y2="141" class="tickR"/>
    <line x1="766.25" y1="130" x2="766.25" y2="138" class="tick"/>
    <line x1="822.5" y1="130" x2="822.5" y2="138" class="tick"/>
    <line x1="878.75" y1="130" x2="878.75" y2="138" class="tick"/>
    <line x1="935" y1="127" x2="935" y2="141" class="tickR"/>
    <line x1="991.25" y1="130" x2="991.25" y2="138" class="tick"/>
    <line x1="1047.5" y1="130" x2="1047.5" y2="138" class="tick"/>
    <line x1="1103.75" y1="130" x2="1103.75" y2="138" class="tick"/>
  </g>
  <line x1="485" y1="146" x2="485" y2="520" class="grenze"/>
  <line x1="710" y1="146" x2="710" y2="520" class="grenze"/>
  <line x1="935" y1="146" x2="935" y2="520" class="grenze"/>

  <!-- Zeilenbeschriftung -->
  <text x="40" y="164" class="s">Grundmuster</text>
  <text x="40" y="181" class="m">läuft immer, −12 dB bei Mitspielern</text>
  <text x="40" y="220" class="s">Mitspieler 1 · Trommel</text>
  <text x="40" y="237" class="m">im Browser</text>
  <text x="40" y="282" class="s">Mitspieler 2 · Bass</text>
  <text x="40" y="299" class="m">Handy-App über die Brücke</text>
  <text x="40" y="350" class="s">Station</text>
  <text x="40" y="367" class="m">die einzige Uhr</text>
  <text x="40" y="418" class="s">Mix an alle Mitspieler</text>
  <text x="40" y="435" class="m">dazu spielt man die nächste Runde</text>
  <text x="40" y="486" class="s">Hörer im Radio</text>
  <text x="40" y="503" class="m">Puffer etwa 2 s</text>

  <!-- Grundmuster: voll in n−1, danach leiser -->
  <rect x="260" y="150" width="900" height="32" rx="8" class="well"/>
  <rect x="264" y="150" width="217" height="32" fill="url(#schritte)"/>
  <g class="leise"><rect x="489" y="150" width="667" height="32" fill="url(#schritte)"/></g>

  <!-- Mitspieler 1 · Trommel: spielt ab Runde n -->
  <rect x="491" y="200" width="213" height="46" rx="8" class="card"/>
  <rect x="491" y="206" width="4" height="34" rx="2" class="accF"/>
  <text x="505" y="220" class="s">spielt Runde n</text>
  <text x="505" y="237" class="m">hört sich selbst sofort</text>
  <rect x="716" y="200" width="213" height="46" rx="8" class="card"/>
  <rect x="716" y="206" width="4" height="34" rx="2" class="accF"/>
  <text x="730" y="220" class="s">spielt Runde n+1</text>
  <text x="730" y="237" class="m">zum Mix der Runde n</text>
  <rect x="941" y="200" width="213" height="46" rx="8" class="card"/>
  <rect x="941" y="206" width="4" height="34" rx="2" class="accF"/>
  <text x="955" y="220" class="s">spielt Runde n+2</text>
  <text x="955" y="237" class="m">zum Mix der Runde n+1</text>

  <!-- Mitspieler 2 · Bass: steigt in Runde n+1 ein -->
  <rect x="716" y="262" width="213" height="46" rx="8" class="card"/>
  <rect x="716" y="268" width="4" height="34" rx="2" class="accF"/>
  <text x="730" y="282" class="s">steigt ein, spielt n+1</text>
  <text x="730" y="299" class="m">zur Trommel aus Runde n</text>
  <rect x="941" y="262" width="213" height="46" rx="8" class="card"/>
  <rect x="941" y="268" width="4" height="34" rx="2" class="accF"/>
  <text x="955" y="282" class="s">spielt Runde n+2</text>
  <text x="955" y="299" class="m">zum Mix der Runde n+1</text>

  <!-- Station: mischt die vorige, sammelt die laufende Runde -->
  <rect x="266" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="280" y="350" class="s">mischt n−2</text>
  <text x="280" y="367" class="m">sammelt n−1</text>
  <rect x="491" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="505" y="350" class="s">mischt n−1</text>
  <text x="505" y="367" class="m">sammelt n</text>
  <rect x="716" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="730" y="350" class="s">mischt n</text>
  <text x="730" y="367" class="m">sammelt n+1</text>
  <rect x="941" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="955" y="350" class="s">mischt n+1</text>
  <text x="955" y="367" class="m">sammelt n+2</text>

  <!-- Mix an alle -->
  <rect x="266" y="398" width="213" height="46" rx="8" class="well"/>
  <text x="280" y="418" class="s">Mix n−2</text>
  <text x="280" y="435" class="m">nur Grundmuster</text>
  <rect x="491" y="398" width="213" height="46" rx="8" class="well"/>
  <text x="505" y="418" class="s">Mix n−1</text>
  <text x="505" y="435" class="m">nur Grundmuster</text>
  <rect x="716" y="398" width="213" height="46" rx="8" class="card"/>
  <rect x="716" y="404" width="4" height="34" rx="2" class="accF"/>
  <text x="730" y="418" class="s">Mix n</text>
  <text x="730" y="435" class="m">Grundmuster + Trommel</text>
  <rect x="941" y="398" width="213" height="46" rx="8" class="card"/>
  <rect x="941" y="404" width="4" height="34" rx="2" class="accF"/>
  <text x="955" y="418" class="s">Mix n+1</text>
  <text x="955" y="435" class="m">+ Trommel + Bass</text>

  <!-- Hörer im Radio: dieselben Mixe, etwa 2 s später -->
  <rect x="260" y="466" width="50" height="46" rx="8" class="well"/>
  <rect x="322" y="466" width="213" height="46" rx="8" class="well"/>
  <text x="336" y="486" class="s">Mix n−2</text>
  <text x="336" y="503" class="m">Radio-Strom, lückenlos</text>
  <rect x="547" y="466" width="213" height="46" rx="8" class="well"/>
  <text x="561" y="486" class="s">Mix n−1</text>
  <text x="561" y="503" class="m">Radio-Strom, lückenlos</text>
  <rect x="772" y="466" width="213" height="46" rx="8" class="card"/>
  <rect x="772" y="472" width="4" height="34" rx="2" class="accF"/>
  <text x="786" y="486" class="s">Mix n</text>
  <text x="786" y="503" class="m">die Trommel im Radio</text>
  <rect x="997" y="466" width="163" height="46" rx="8" class="card"/>
  <rect x="997" y="472" width="4" height="34" rx="2" class="accF"/>
  <text x="1011" y="486" class="s">Mix n+1</text>
  <text x="1011" y="503" class="m">… läuft weiter</text>

  <!-- Wege: Trommel n → Station (mischt n) → Mix n; Bass hört Mix n und spielt dazu -->
  <path d="M688,246 C704,252 710,262 710,282 L710,306 C710,316 714,322 720,326" class="pA"/>
  <path d="M760,376 L760,394" class="pA"/>
  <path d="M884,398 L884,312" class="pg"/>
  <text x="876" y="390" text-anchor="end" class="lab">hört, spielt dazu</text>
  <path d="M922,308 C934,314 940,320 944,326" class="pA"/>
  <path d="M760,444 L760,452 L800,452 L800,462" class="pg"/>

  <!-- Merksätze -->
  <rect x="40" y="546" width="360" height="82" rx="12" class="card"/>
  <circle cx="64" cy="572" r="13" class="nr"/><text x="64" y="577" text-anchor="middle" class="nrT">1</text>
  <text x="88" y="577" class="t">Eine Runde später</text>
  <text x="58" y="600" class="m">Runde n spielen, in Runde n+1 hören alle den Mix.</text>
  <text x="58" y="616" class="m">Dich selbst hörst du sofort am eigenen Gerät.</text>

  <rect x="420" y="546" width="360" height="82" rx="12" class="card"/>
  <circle cx="444" cy="572" r="13" class="nr"/><text x="444" y="577" text-anchor="middle" class="nrT">2</text>
  <text x="468" y="577" class="t">Die Schleife wartet nie</text>
  <text x="438" y="600" class="m">Kommt ein Block später als 1,5 s nach Rundenende,</text>
  <text x="438" y="616" class="m">bleibt die Spur in diesem Mix stumm.</text>

  <rect x="800" y="546" width="360" height="82" rx="12" class="card"/>
  <circle cx="824" cy="572" r="13" class="nr"/><text x="824" y="577" text-anchor="middle" class="nrT">3</text>
  <text x="848" y="577" class="t">Grundmuster als Boden</text>
  <text x="818" y="600" class="m">Spielt niemand, läuft das automatische Radio 24/7.</text>
  <text x="818" y="616" class="m">Gesten wie „schütteln“ heben die Energie.</text>

  <text x="40" y="660" class="f">Entwurf 23.11.2026 · Caelum GmbH · nach station/ENTWURF.md §1, §2, §12 und radio/ENTWURF.md §3 · Werte: Standard der Station, BPM vom Gastgeber</text>
  <!-- Bewegung (Web): Abspielkopf in Echtzeit, 8 s je Runde, 4 Runden = 32 s -->
  <g class="bewegt">
    <line x1="260" y1="140" x2="260" y2="516" class="kopf"/>
    <circle cx="260" cy="134" r="5.5" class="zeiger"/>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="32s" repeatCount="indefinite"/>
  </g>
</svg>
