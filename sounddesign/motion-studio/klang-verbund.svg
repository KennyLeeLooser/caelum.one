<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="titel beschr">
  <title id="titel">Caelum Motion Studio – Klang-Verbund</title>
  <desc id="beschr">Eine Uhr – die Caelum Station – gibt Tempo, Takt und Runde vor; Motion-Bridge, Android-App, Web-Studio, caelum.one und Caelum Radio folgen ihr. Drums, Synth und Sequenzer-Muster klingen überall gleich. Samples haben einen Ausweis mit Tempo, Tonhöhe und Raster und werden als One-Shot, Live oder Loop gespielt und freigegeben. Gestrichelt = geplant.</desc>
  <defs>
    <style>
      .bg { fill: #262624; }
      .card { fill: #30302E; stroke: #3D3D3A; stroke-width: 1.5; }
      .haupt { fill: #30302E; stroke: #C8479A; stroke-width: 2.5; }
      .gast { fill: none; stroke: #9C9A94; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .chip { fill: #262624; stroke: #3D3D3A; stroke-width: 1.2; }
      .chipA { fill: #262624; stroke: #C8479A; stroke-width: 1.5; }
      .chipG { fill: none; stroke: #9C9A94; stroke-width: 1.2; stroke-dasharray: 4 4; }
      .h { fill: #E8E6E1; font-size: 26px; font-weight: 600; }
      .sub { fill: #9C9A94; font-size: 15px; }
      .t { fill: #E8E6E1; font-size: 17px; font-weight: 600; }
      .s { fill: #C9C6BF; font-size: 13.5px; }
      .m { fill: #9C9A94; font-size: 12px; }
      .f { fill: #6E6C66; font-size: 11.5px; }
      .c { fill: #E8E6E1; font-size: 12.5px; font-weight: 600; }
      .stA { fill: #C8479A; font-size: 15px; font-weight: 600; }
      .nr { fill: #C8479A; }
      .nrT { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
      .p { fill: none; stroke: #C9C6BF; stroke-width: 2; stroke-linecap: round; }
      .pg { fill: none; stroke: #9C9A94; stroke-width: 2; stroke-dasharray: 6 5; stroke-linecap: round; }
      .pA { fill: none; stroke: #C8479A; stroke-width: 3; stroke-linecap: round; }
      .schlag { fill: #3D3D3A; }
      .eins { fill: #C8479A; }
      .kopf { fill: #C8479A; }
      .leer { fill: transparent; }
      @media (prefers-reduced-motion: reduce) { .bewegt { display: none; } }
      @media (prefers-color-scheme: light) {
        .bg, .chip, .chipA { fill: #FAF9F6; }
        .card, .haupt { fill: #FFFFFF; }
        .card, .chip { stroke: #D9D6CF; }
        .haupt, .chipA { stroke: #B03A85; }
        .gast, .chipG { stroke: #6E6C66; }
        .h, .t, .c { fill: #1F1E1D; }
        .s { fill: #3D3D3A; }
        .sub, .m { fill: #5F5D58; }
        .f { fill: #8A877F; }
        .stA, .nr, .eins, .kopf { fill: #B03A85; }
        .schlag { fill: #D9D6CF; }
        .p { stroke: #3D3D3A; }
        .pg { stroke: #6E6C66; }
        .pA { stroke: #B03A85; }
      }
    </style>
  </defs>

  <rect width="1200" height="680" rx="16" class="bg"/>
  <text x="40" y="54" class="h">Klang-Verbund</text>
  <text x="40" y="80" class="sub">Eine Uhr · ein Klang · Samples im Takt – am Smartphone, im Browser, in der DAW und im Radio</text>

  
  <path d="M340,170 H450" class="p"/>
  <path d="M750,170 H860" class="pg"/>
  <path d="M600,232 V260 H144 V290" class="pg"/>
  <path d="M600,260 H372 V290" class="pg"/>
  <path d="M600,232 V290" class="pA"/>
  <path d="M600,260 H828 V290" class="pg"/>
  <path d="M600,260 H1056 V290" class="p"/>

  
  <rect x="40" y="110" width="300" height="120" rx="12" class="card" data-teil="hauptfenster"/>
  <text x="58" y="140" class="t">Hauptfenster</text>
  <text x="58" y="164" class="s">Studio · Station · Radio</text>
  <text x="58" y="186" class="m">Rollen: A Admin · B Master · C Spieler</text>
  <text x="58" y="210" class="f">auf der Station · läuft</text>

  <rect x="450" y="102" width="300" height="130" rx="12" class="haupt" data-teil="uhr"/>
  <circle cx="474" cy="128" r="11" class="nr"/><text x="474" y="132.5" text-anchor="middle" class="nrT">1</text>
  <text x="494" y="134" class="t">Eine Uhr</text>
  <text x="568" y="134" class="m">Caelum Station</text>
  <text x="468" y="158" class="s">BPM · 4/4 · Position · Runde</text>
  
  <rect x="470" y="174" width="60" height="10" rx="3" class="eins"/>
  <rect x="536" y="174" width="60" height="10" rx="3" class="schlag"/>
  <rect x="602" y="174" width="60" height="10" rx="3" class="schlag"/>
  <rect x="668" y="174" width="60" height="10" rx="3" class="schlag"/>
  <g class="bewegt">
    <rect x="470" y="170" width="3" height="18" rx="1.5" class="kopf">
      <animate attributeName="x" values="470;727" dur="2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="468" y="212" class="m">alle folgen – keiner zählt selbst los</text>

  <rect x="860" y="110" width="300" height="120" rx="12" class="gast" data-teil="netz"/>
  <text x="878" y="140" class="t">Selber vernetzen</text>
  <text x="878" y="164" class="s">eigene Stationen verbinden</text>
  <text x="878" y="186" class="m">fremde VST nur am eigenen PC</text>
  <text x="878" y="210" class="f">geplant · später</text>

  
  <rect x="40" y="290" width="208" height="130" rx="12" class="card" data-teil="bruecke"/>
  <text x="58" y="320" class="t">Motion-Bridge</text>
  <text x="58" y="344" class="s">MIDI-Clock 24 ppqn</text>
  <text x="58" y="364" class="m">an DAW und Smartphones</text>
  <text x="58" y="400" class="f">Uhr der Station · in Arbeit</text>

  <rect x="268" y="290" width="208" height="130" rx="12" class="card" data-teil="handy"/>
  <text x="286" y="320" class="t">Android-App</text>
  <text x="286" y="344" class="s">Drum · Sequenzer · Looper</text>
  <text x="286" y="364" class="m">eigene Uhr, abtastgenau</text>
  <text x="286" y="400" class="f">folgt der Station · geplant</text>

  <rect x="496" y="290" width="208" height="130" rx="12" class="card" data-teil="web-studio"/>
  <text x="514" y="320" class="t">Web-Studio</text>
  <text x="514" y="344" class="s">16 Instrumente × 16 Steps</text>
  <text x="514" y="364" class="m">im Browser mitspielen</text>
  <text x="514" y="400" class="f">folgt der Runden-Uhr</text>

  <rect x="724" y="290" width="208" height="130" rx="12" class="gast" data-teil="caelum-one"/>
  <text x="742" y="320" class="t">caelum.one</text>
  <text x="742" y="344" class="s">Synth + EQ im Browser</text>
  <text x="742" y="364" class="m">öffentlich, über HTTPS</text>
  <text x="742" y="400" class="f">geplant</text>

  <rect x="952" y="290" width="208" height="130" rx="12" class="card" data-teil="radio"/>
  <text x="970" y="320" class="t">Caelum Radio</text>
  <text x="970" y="344" class="s">Mix eine Runde später</text>
  <text x="970" y="364" class="m">Tempo der Runde dabei</text>
  <text x="970" y="400" class="f">hört mit</text>

  
  <rect x="40" y="460" width="540" height="160" rx="12" class="card" data-teil="ein-klang"/>
  <circle cx="64" cy="486" r="11" class="nr"/><text x="64" y="490.5" text-anchor="middle" class="nrT">2</text>
  <text x="84" y="492" class="t">Ein Klang überall</text>
  <text x="58" y="518" class="s">Drums 808 · Synth · Sequenzer-Muster rechnen überall gleich</text>
  <rect x="58" y="534" width="140" height="32" rx="8" class="chipA"/><text x="128" y="555" text-anchor="middle" class="c">App</text>
  <text x="212" y="555" text-anchor="middle" class="m">=</text>
  <rect x="226" y="534" width="140" height="32" rx="8" class="chipA"/><text x="296" y="555" text-anchor="middle" class="c">Kern</text>
  <text x="380" y="555" text-anchor="middle" class="m">≈</text>
  <rect x="394" y="534" width="140" height="32" rx="8" class="chipG"/><text x="464" y="555" text-anchor="middle" class="c">Browser</text>
  <text x="58" y="596" class="m">App = Kern bitgleich · Browser bald mit dem Kern selbst · ein Muster-Format</text>

  <rect x="620" y="460" width="540" height="160" rx="12" class="gast" data-teil="samples"/>
  <circle cx="644" cy="486" r="11" class="nr"/><text x="644" y="490.5" text-anchor="middle" class="nrT">3</text>
  <text x="664" y="492" class="t">Samples im Takt</text>
  <text x="638" y="518" class="s">Ausweis: Tempo · Tonhöhe · 48 kHz · Raster an/aus</text>
  <rect x="638" y="534" width="112" height="32" rx="8" class="chipG"/><text x="694" y="555" text-anchor="middle" class="c">One-Shot</text>
  <rect x="760" y="534" width="112" height="32" rx="8" class="chipG" data-teil="live"/><text x="816" y="555" text-anchor="middle" class="c">Live</text>
  <rect x="882" y="534" width="112" height="32" rx="8" class="chipG"/><text x="938" y="555" text-anchor="middle" class="c">Loop</text>
  <rect x="1022" y="534" width="120" height="32" rx="8" class="chipG" data-teil="freigabe"/><text x="1082" y="555" text-anchor="middle" class="c">Freigabe</text>
  <text x="638" y="590" class="m">Sequenzer im Raster · Drum frei oder quantisiert</text>
  <text x="638" y="607" class="m">Mikrofon live – nur Loops rasten auf die Takt-Eins</text>

  <text x="40" y="652" class="f">durchgezogen = läuft · gestrichelt = geplant oder in Arbeit · Purpur = der Takt, dem alle folgen</text>
</svg>
