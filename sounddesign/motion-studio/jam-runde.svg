      <rect x="266" y="330" width="213" height="46" rx="8" class="glut"/>
      <rect x="266" y="398" width="213" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="1;0" calcMode="discrete" keyTimes="0;0.25" dur="32s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="491" y="200" width="213" height="46" rx="8" class="glut"/>
      <rect x="491" y="330" width="213" height="46" rx="8" class="glut"/>
      <rect x="491" y="398" width="213" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="0;1;0" calcMode="discrete" keyTimes="0;0.25;0.5" dur="32s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="716" y="200" width="213" height="46" rx="8" class="glut"/>
      <rect x="716" y="262" width="213" height="46" rx="8" class="glut"/>
      <rect x="716" y="330" width="213" height="46" rx="8" class="glut"/>
      <rect x="716" y="398" width="213" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="0;1;0" calcMode="discrete" keyTimes="0;0.5;0.75" dur="32s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="941" y="200" width="213" height="46" rx="8" class="glut"/>
      <rect x="941" y="262" width="213" height="46" rx="8" class="glut"/>
      <rect x="941" y="330" width="213" height="46" rx="8" class="glut"/>
      <rect x="941" y="398" width="213" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="0;1" calcMode="discrete" keyTimes="0;0.75" dur="32s" repeatCount="indefinite"/>
    </g>
    
    <g opacity="0">
      <rect x="322" y="466" width="213" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="0;1;0" calcMode="discrete" keyTimes="0;0.0625;0.3125" dur="32s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="547" y="466" width="213" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="0;1;0" calcMode="discrete" keyTimes="0;0.3125;0.5625" dur="32s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="772" y="466" width="213" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="0;1;0" calcMode="discrete" keyTimes="0;0.5625;0.8125" dur="32s" repeatCount="indefinite"/>
    </g>
    <g opacity="0">
      <rect x="997" y="466" width="163" height="46" rx="8" class="glut"/>
      <animate attributeName="opacity" values="1;0;1" calcMode="discrete" keyTimes="0;0.0625;0.8125" dur="32s" repeatCount="indefinite"/>
    </g>
    
    <g>
      <line x1="260" y1="140" x2="260" y2="516" class="kopf"/>
      <circle cx="260" cy="134" r="5.5" class="zeiger"/>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="900 0" dur="32s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
