<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="titel beschr">
  <title id="titel">Caelum Station – der Jam-Zyklus</title>
  <desc id="beschr">Zeitachse über vier Zyklen zu je 4 Takten (8 Sekunden bei 120 BPM). Was ein Musiker in Zyklus n spielt, nimmt der Jam-Server auf, mischt es am Zyklusende und schickt den Mix in Zyklus n+1 an alle. Ein Backing-Loop läuft immer. Der Live-Stream liegt etwa 2 Sekunden dahinter.</desc>
  <defs>
    <style>
      .bg { fill: #262624; }
      .card { fill: #30302E; stroke: #3D3D3A; stroke-width: 1.5; }
      .geplant { stroke: #6E6C66; stroke-dasharray: 5 4; }
      .well { fill: #1F1E1D; stroke: #3D3D3A; stroke-width: 1.5; }
      .accF { fill: #C8479A; }
      .h { fill: #E8E6E1; font-size: 26px; font-weight: 600; }
      .sub { fill: #9C9A94; font-size: 15px; }
      .t { fill: #E8E6E1; font-size: 15px; font-weight: 600; }
      .tA { fill: #C8479A; font-size: 15px; font-weight: 600; }
      .s { fill: #C9C6BF; font-size: 13.5px; }
      .m { fill: #9C9A94; font-size: 12px; }
      .f { fill: #6E6C66; font-size: 11.5px; }
      .nr { fill: #C8479A; }
      .nrT { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
      .grenze { stroke: #3D3D3A; stroke-width: 1.5; stroke-dasharray: 3 5; }
      .achse { stroke: #9C9A94; stroke-width: 1.5; fill: none; }
      .tick { stroke: #6E6C66; stroke-width: 1.5; }
      .tickR { stroke: #9C9A94; stroke-width: 2; }
      .dot { fill: #6E6C66; }
      .dotA { fill: #9C9A94; }
      .leise { opacity: 0.45; }
      .pg { fill: none; stroke: #9C9A94; stroke-width: 1.8; stroke-dasharray: 5 4; stroke-linecap: round; }
      .pA { fill: none; stroke: #C8479A; stroke-width: 2.5; stroke-linecap: round; }
      .ende { fill: #C8479A; }
      .endeG { fill: #9C9A94; }
      .zeiger { fill: #C8479A; stroke: #262624; stroke-width: 3; }
      .kopf { stroke: #C8479A; stroke-width: 1.5; opacity: 0.8; }
      .band { fill: #C8479A; opacity: 0.07; }
      .glut { fill: none; stroke: #C8479A; stroke-width: 2; }
      @media (prefers-reduced-motion: reduce) { .bewegt { display: none; } }
      @media (prefers-color-scheme: light) {
        .bg { fill: #FAF9F6; }
        .card { fill: #FFFFFF; stroke: #D9D6CF; }
        .geplant { stroke: #8A877F; }
        .well { fill: #F0EEE9; stroke: #D9D6CF; }
        .accF, .nr, .ende, .band { fill: #B03A85; }
        .h, .t { fill: #1F1E1D; }
        .tA { fill: #B03A85; }
        .s { fill: #3D3D3A; }
        .sub, .m { fill: #5F5D58; }
        .f { fill: #8A877F; }
        .grenze { stroke: #D9D6CF; }
        .achse, .tickR { stroke: #5F5D58; }
        .tick { stroke: #B8B5AD; }
        .dot { fill: #B8B5AD; }
        .dotA { fill: #6E6C66; }
        .pg { stroke: #6E6C66; }
        .endeG { fill: #6E6C66; }
        .pA, .kopf, .glut { stroke: #B03A85; }
        .zeiger { fill: #B03A85; stroke: #FAF9F6; }
      }
    </style>
    
    <pattern id="schritte" patternUnits="userSpaceOnUse" x="260" y="150" width="56.25" height="32">
      <circle cx="7" cy="16" r="3.4" class="dotA"/>
      <circle cx="21.06" cy="16" r="2.2" class="dot"/>
      <circle cx="35.12" cy="16" r="2.2" class="dot"/>
      <circle cx="49.19" cy="16" r="2.2" class="dot"/>
    </pattern>
  </defs>

  <rect width="1200" height="680" rx="16" class="bg"/>
  <text x="40" y="54" class="h">Der Jam-Zyklus</text>
  <text x="40" y="80" class="sub">Gespielt in Zyklus n, gehört von allen in Zyklus n+1. 1 Zyklus = 4 Takte = 8 s bei 120 BPM · Latenz wird zum Groove.</text>

  
  <text x="372.5" y="118" text-anchor="middle" class="t">Zyklus n−1</text>
  <text x="597.5" y="118" text-anchor="middle" class="tA">Zyklus n</text>
  <text x="822.5" y="118" text-anchor="middle" class="t">Zyklus n+1</text>
  <text x="1047.5" y="118" text-anchor="middle" class="t">Zyklus n+2</text>
  <line x1="260" y1="134" x2="1160" y2="134" class="achse"/>
  <text x="40" y="138" class="m">Zeit · 4 Takte je Zyklus</text>
  <g>
    <line x1="260" y1="127" x2="260" y2="141" class="tickR"/>
    <line x1="316.25" y1="130" x2="316.25" y2="138" class="tick"/>
    <line x1="372.5" y1="130" x2="372.5" y2="138" class="tick"/>
    <line x1="428.75" y1="130" x2="428.75" y2="138" class="tick"/>
    <line x1="485" y1="127" x2="485" y2="141" class="tickR"/>
    <line x1="541.25" y1="130" x2="541.25" y2="138" class="tick"/>
    <line x1="597.5" y1="130" x2="597.5" y2="138" class="tick"/>
    <line x1="653.75" y1="130" x2="653.75" y2="138" class="tick"/>
    <line x1="710" y1="127" x2="710" y2="141" class="tickR"/>
    <line x1="766.25" y1="130" x2="766.25" y2="138" class="tick"/>
    <line x1="822.5" y1="130" x2="822.5" y2="138" class="tick"/>
    <line x1="878.75" y1="130" x2="878.75" y2="138" class="tick"/>
    <line x1="935" y1="127" x2="935" y2="141" class="tickR"/>
    <line x1="991.25" y1="130" x2="991.25" y2="138" class="tick"/>
    <line x1="1047.5" y1="130" x2="1047.5" y2="138" class="tick"/>
    <line x1="1103.75" y1="130" x2="1103.75" y2="138" class="tick"/>
    <line x1="1160" y1="127" x2="1160" y2="141" class="tickR"/>
  </g>
  <line x1="485" y1="146" x2="485" y2="520" class="grenze"/>
  <line x1="710" y1="146" x2="710" y2="520" class="grenze"/>
  <line x1="935" y1="146" x2="935" y2="520" class="grenze"/>

  
  <g class="bewegt">
    <rect x="260" y="146" width="225" height="374" class="band">
      <animateTransform attributeName="transform" type="translate" values="0 0;225 0;450 0;675 0" calcMode="discrete" keyTimes="0;0.25;0.5;0.75" dur="32s" repeatCount="indefinite"/>
    </rect>
  </g>

  
  <g fill="none">
    <rect x="260" y="150" width="900" height="32" data-teil="backing-loop"/>
    <rect x="491" y="200" width="663" height="46" data-teil="drums"/>
    <rect x="716" y="262" width="438" height="46" data-teil="bass"/>
    <rect x="266" y="330" width="888" height="46" data-teil="jam-server"/>
    <rect x="266" y="398" width="888" height="46" data-teil="mix"/>
    <rect x="260" y="466" width="900" height="46" data-teil="stream"/>
  </g>

  
  <text x="40" y="164" class="s">Backing-Loop</text>
  <text x="40" y="181" class="m">läuft immer · −12 dB, sobald wer spielt</text>
  <text x="40" y="220" class="s">Musiker 1 · Drums</text>
  <text x="40" y="237" class="m">Web-Client</text>
  <text x="40" y="282" class="s">Musiker 2 · Bass</text>
  <text x="40" y="299" class="m">Android über Bridge · geplant</text>
  <text x="40" y="350" class="s">Jam-Server</text>
  <text x="40" y="367" class="m">Master-Clock für alle</text>
  <text x="40" y="418" class="s">Mix an alle Musiker</text>
  <text x="40" y="435" class="m">dazu spielt man den nächsten Zyklus</text>
  <text x="40" y="486" class="s">Live-Stream</text>
  <text x="40" y="503" class="m">Puffer ca. 2 s</text>

  
  <rect x="260" y="150" width="900" height="32" rx="8" class="well"/>
  <rect x="264" y="150" width="217" height="32" fill="url(#schritte)"/>
  <g class="leise"><rect x="489" y="150" width="667" height="32" fill="url(#schritte)"/></g>

  
  <rect x="491" y="200" width="213" height="46" rx="8" class="card"/>
  <rect x="491" y="206" width="4" height="34" rx="2" class="accF"/>
  <text x="505" y="220" class="s">spielt Zyklus n</text>
  <text x="505" y="237" class="m">Monitoring direkt, ohne Latenz</text>
  <rect x="716" y="200" width="213" height="46" rx="8" class="card"/>
  <rect x="716" y="206" width="4" height="34" rx="2" class="accF"/>
  <text x="730" y="220" class="s">spielt Zyklus n+1</text>
  <text x="730" y="237" class="m">zum Mix von Zyklus n</text>
  <rect x="941" y="200" width="213" height="46" rx="8" class="card"/>
  <rect x="941" y="206" width="4" height="34" rx="2" class="accF"/>
  <text x="955" y="220" class="s">spielt Zyklus n+2</text>
  <text x="955" y="237" class="m">zum Mix von Zyklus n+1</text>

  
  <rect x="716" y="262" width="213" height="46" rx="8" class="card geplant"/>
  <rect x="716" y="268" width="4" height="34" rx="2" class="accF"/>
  <text x="730" y="282" class="s">steigt ein, spielt n+1</text>
  <text x="730" y="299" class="m">zu den Drums aus Zyklus n</text>
  <rect x="941" y="262" width="213" height="46" rx="8" class="card geplant"/>
  <rect x="941" y="268" width="4" height="34" rx="2" class="accF"/>
  <text x="955" y="282" class="s">spielt Zyklus n+2</text>
  <text x="955" y="299" class="m">zum Mix von Zyklus n+1</text>

  
  <rect x="266" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="280" y="350" class="s">mischt n−2</text>
  <text x="280" y="367" class="m">nimmt n−1 auf</text>
  <rect x="491" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="505" y="350" class="s">mischt n−1</text>
  <text x="505" y="367" class="m">nimmt n auf</text>
  <rect x="716" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="730" y="350" class="s">mischt n</text>
  <text x="730" y="367" class="m">nimmt n+1 auf</text>
  <rect x="941" y="330" width="213" height="46" rx="8" class="card"/>
  <text x="955" y="350" class="s">mischt n+1</text>
  <text x="955" y="367" class="m">nimmt n+2 auf</text>

  
  <rect x="266" y="398" width="213" height="46" rx="8" class="well"/>
  <text x="280" y="418" class="s">Mix n−2</text>
  <text x="280" y="435" class="m">nur Backing-Loop</text>
  <rect x="491" y="398" width="213" height="46" rx="8" class="well"/>
  <text x="505" y="418" class="s">Mix n−1</text>
  <text x="505" y="435" class="m">nur Backing-Loop</text>
  <rect x="716" y="398" width="213" height="46" rx="8" class="card"/>
  <rect x="716" y="404" width="4" height="34" rx="2" class="accF"/>
  <text x="730" y="418" class="s">Mix n</text>
  <text x="730" y="435" class="m">Backing + Drums</text>
  <rect x="941" y="398" width="213" height="46" rx="8" class="card"/>
  <rect x="941" y="404" width="4" height="34" rx="2" class="accF"/>
  <text x="955" y="418" class="s">Mix n+1</text>
  <text x="955" y="435" class="m">Backing + Drums + Bass</text>

  
  <rect x="260" y="466" width="50" height="46" rx="8" class="well"/>
  <rect x="322" y="466" width="213" height="46" rx="8" class="well"/>
  <text x="336" y="486" class="s">Mix n−2</text>
  <text x="336" y="503" class="m">lückenlos gestreamt</text>
  <rect x="547" y="466" width="213" height="46" rx="8" class="well"/>
  <text x="561" y="486" class="s">Mix n−1</text>
  <text x="561" y="503" class="m">lückenlos gestreamt</text>
  <rect x="772" y="466" width="213" height="46" rx="8" class="card"/>
  <rect x="772" y="472" width="4" height="34" rx="2" class="accF"/>
  <text x="786" y="486" class="s">Mix n</text>
  <text x="786" y="503" class="m">Drums im Stream</text>
  <rect x="997" y="466" width="163" height="46" rx="8" class="card"/>
  <rect x="997" y="472" width="4" height="34" rx="2" class="accF"/>
  <text x="1011" y="486" class="s">Mix n+1</text>
  <text x="1011" y="503" class="m">… läuft weiter</text>

  
  <path d="M597.5,250 V324" class="pA"/><circle cx="597.5" cy="326" r="3.5" class="ende"/>
  <path d="M822.5,312 V324" class="pA"/><circle cx="822.5" cy="326" r="3.5" class="ende"/>
  <path d="M822.5,380 V392" class="pA"/><circle cx="822.5" cy="394" r="3.5" class="ende"/>
  <path d="M850.5,448 V460" class="pg"/><circle cx="850.5" cy="462" r="3" class="endeG"/>

  
  <rect x="40" y="546" width="360" height="82" rx="12" class="card" data-teil="latenz"/>
  <circle cx="64" cy="572" r="13" class="nr"/><text x="64" y="577" text-anchor="middle" class="nrT">1</text>
  <text x="88" y="577" class="t">Latenz = 1 Zyklus</text>
  <text x="58" y="600" class="m">Du spielst zum Mix des letzten Zyklus.</text>
  <text x="58" y="616" class="m">Dein eigenes Signal hörst du direkt am Gerät.</text>

  <rect x="420" y="546" width="360" height="82" rx="12" class="card" data-teil="loop-stoppt-nie"/>
  <circle cx="444" cy="572" r="13" class="nr"/><text x="444" y="577" text-anchor="middle" class="nrT">2</text>
  <text x="468" y="577" class="t">Der Loop stoppt nie</text>
  <text x="438" y="600" class="m">Kommt ein Block mehr als 1,5 s zu spät,</text>
  <text x="438" y="616" class="m">ist die Spur nur in diesem Mix stumm.</text>

  <rect x="800" y="546" width="360" height="82" rx="12" class="card" data-teil="nie-stille"/>
  <circle cx="824" cy="572" r="13" class="nr"/><text x="824" y="577" text-anchor="middle" class="nrT">3</text>
  <text x="848" y="577" class="t">Nie Stille</text>
  <text x="818" y="600" class="m">Ohne Musiker läuft der Backing-Loop 24/7.</text>
  <text x="818" y="616" class="m">Gesten wie Schütteln heben die Energie.</text>

  <text x="40" y="660" class="f">Entwurf 24.11.2026 · Caelum GmbH · BPM setzt der Session-Host · gestrichelt = geplant</text>

  
  <g class="bewegt">
