      .knopf { fill: #3D3D3A; }
      .zeiger { stroke: #E8E6E1; stroke-width: 2; stroke-linecap: round; }
      .bahn { stroke: #3D3D3A; stroke-width: 4; stroke-linecap: round; }
      .bahnG { stroke: #6E6C66; stroke-width: 2; stroke-dasharray: 4 4; }
