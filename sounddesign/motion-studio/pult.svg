      .nr { fill: #C8479A; }
      .nrT { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
      .leer { fill: transparent; }
      @media (prefers-reduced-motion: reduce) { .bewegt { display: none; } }
      @media (prefers-color-scheme: light) {
        .bg, .zug, .chip, .chipA { fill: #FAF9F6; }
        .card, .haupt { fill: #FFFFFF; }
        .card, .zug, .chip { stroke: #D9D6CF; }
        .haupt, .chipA { stroke: #B03A85; }
        .gast { stroke: #6E6C66; }
        .geist, .bahnG { stroke: #8A877F; }
        .knopf, .mess { fill: #D9D6CF; }
        .bahn { stroke: #D9D6CF; }
        .zeiger { stroke: #1F1E1D; }
        .kappe { fill: #3D3D3A; }
        .pegel { fill: #8A877F; }
        .rec { stroke: #6E6C66; }
        .h, .t, .c { fill: #1F1E1D; }
        .s, .z { fill: #3D3D3A; }
        .sub, .m { fill: #5F5D58; }
        .f { fill: #8A877F; }
        .stA, .nr, .recAn, .kappeA { fill: #B03A85; }
      }
    </style>
