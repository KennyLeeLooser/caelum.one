  <text x="808" y="162" class="s">hört den Mix, misst, stellt Fader nach</text>
  <text x="808" y="186" class="m">höchstens 1,5 dB je Runde · erst vorschlagen</text>
  <text x="808" y="208" class="m">Mensch greift ein → 4 Runden still</text>
  <text x="808" y="230" class="m">nie Neustart, nie Tempo, nie Spur entfernen</text>
