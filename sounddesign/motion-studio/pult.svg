<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="titel beschr">
  <title id="titel">Caelum Motion Studio – Pult</title>
  <desc id="beschr">Ein Mischpult im klassischen Aufbau: acht Kanalzüge mit automatischem Angleich, Pan, Aufnahme, Mute, Solo und Fader in dB, ein Zug für das Grundmuster und eine Summe mit Pegelanzeige und Tempo. Eine KI hört mit und stellt Fader in kleinen Schritten nach, der Mensch hat immer Vorrang. EQ, Kompressor, Hall und ein Hardware-Pult über MIDI sind geplant und gestrichelt.</desc>
  <defs>
    <style>
      .bg { fill: #262624; }
      .card { fill: #30302E; stroke: #3D3D3A; stroke-width: 1.5; }
      .haupt { fill: #30302E; stroke: #C8479A; stroke-width: 2.5; }
      .gast { fill: none; stroke: #9C9A94; stroke-width: 1.5; stroke-dasharray: 6 5; }
