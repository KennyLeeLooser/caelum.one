  <line x1="758" y1="502" x2="758" y2="522" class="p"/><rect x="754" y="508" width="8" height="5" rx="1.5" class="kappe"/>
  <line x1="770" y1="502" x2="770" y2="522" class="p"/><rect x="766" y="514" width="8" height="5" rx="1.5" class="kappe"/>
  <line x1="782" y1="502" x2="782" y2="522" class="p"/><rect x="778" y="510" width="8" height="5" rx="1.5" class="kappe"/>
  <line x1="794" y1="502" x2="794" y2="522" class="p"/><rect x="790" y="506" width="8" height="5" rx="1.5" class="kappe"/>
  <line x1="806" y1="502" x2="806" y2="522" class="p"/><rect x="802" y="511" width="8" height="5" rx="1.5" class="kappe"/>

  
  <rect x="250" y="538" width="630" height="54" rx="10" class="card" data-teil="spuren"/>
  <circle cx="302" cy="565" r="12" class="nr"/><text x="302" y="569" text-anchor="middle" class="nrT">7</text>
  <text x="326" y="561" class="t">Spuren</text>
  <text x="326" y="580" class="m">bis zu acht je Station, dazu das Grundmuster</text>
  <rect x="834" y="546" width="34" height="18" rx="9" class="chip"/><text x="851" y="559" text-anchor="middle" class="z">D</text>
  <line x1="880" y1="565" x2="895" y2="565" class="pg"/><rect x="897" y="561" width="8" height="8" rx="2" class="spitze"/>
  <rect x="740" y="570" width="6" height="14" rx="1.5" class="klein"/>
