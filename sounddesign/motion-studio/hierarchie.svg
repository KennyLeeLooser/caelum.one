  <text x="948" y="546" class="f">3 Bänder × 4 Stationen, ganze Stufen</text>

  
  <line x1="250" y1="696" x2="286" y2="696" class="p"/><text x="296" y="700" class="m">läuft</text>
  <line x1="350" y1="696" x2="386" y2="696" class="pg"/><text x="396" y="700" class="m">geplant</text>
