  <text x="960" y="172" text-anchor="middle" class="f">A</text><line x1="960" y1="180" x2="960" y2="254" class="pg"/><rect x="948" y="190.5" width="24" height="10" rx="3" class="chipG"/><text x="960" y="270" text-anchor="middle" class="f">B</text><text x="960" y="286" text-anchor="middle" class="z">Tief</text>
  <text x="1040" y="172" text-anchor="middle" class="f">A</text><line x1="1040" y1="180" x2="1040" y2="254" class="pg"/><rect x="1028" y="225.6" width="24" height="10" rx="3" class="chipG"/><text x="1040" y="270" text-anchor="middle" class="f">B</text><text x="1040" y="286" text-anchor="middle" class="z">Mitte</text>
  <text x="1120" y="172" text-anchor="middle" class="f">A</text><line x1="1120" y1="180" x2="1120" y2="254" class="pg"/><rect x="1108" y="213.9" width="24" height="10" rx="3" class="chipG"/><text x="1120" y="270" text-anchor="middle" class="f">B</text><text x="1120" y="286" text-anchor="middle" class="z">Hoch</text>
  <text x="948" y="302" class="f">Bass immer nur aus einer Station</text>

  
  <rect x="930" y="330" width="230" height="324" rx="12" class="gast" data-teil="matrix"/>
  <text x="948" y="358" class="t">Stationen-Matrix</text>
  <text x="948" y="378" class="m">welche Station liefert welches Band</text>
  <rect x="1000" y="392" width="22" height="22" rx="4" class="chipG"/><rect x="1028" y="392" width="22" height="22" rx="4" class="chipA"/><rect x="1056" y="392" width="22" height="22" rx="4" class="chipG"/><rect x="1084" y="392" width="22" height="22" rx="4" class="chipG"/>
  <rect x="1000" y="420" width="22" height="22" rx="4" class="chipG"/><rect x="1028" y="420" width="22" height="22" rx="4" class="chipG"/><rect x="1056" y="420" width="22" height="22" rx="4" class="chipG"/><rect x="1084" y="420" width="22" height="22" rx="4" class="chipA"/>
  <rect x="1000" y="448" width="22" height="22" rx="4" class="chipA"/><rect x="1028" y="448" width="22" height="22" rx="4" class="chipG"/><rect x="1056" y="448" width="22" height="22" rx="4" class="chipG"/><rect x="1084" y="448" width="22" height="22" rx="4" class="chipG"/>
  <text x="992" y="407" text-anchor="end" class="f">Hoch</text><text x="992" y="435" text-anchor="end" class="f">Mitte</text><text x="992" y="463" text-anchor="end" class="f">Tief</text>
  <text x="1011" y="490" text-anchor="middle" class="f">1</text><text x="1039" y="490" text-anchor="middle" class="f">2</text><text x="1067" y="490" text-anchor="middle" class="f">3</text><text x="1095" y="490" text-anchor="middle" class="f">4</text>
