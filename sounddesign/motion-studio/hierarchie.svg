  <line x1="880" y1="627" x2="895" y2="627" class="pg"/><rect x="897" y="623" width="8" height="8" rx="2" class="spitze"/>

  
  <line x1="272" y1="648" x2="272" y2="118" class="pA"/>
  <path d="M264,126 L272,114 L280,126" class="pA"/>
  <text x="272" y="674" text-anchor="middle" class="stA">Ton</text>
  <g class="bewegt">
    <circle cx="272" cy="648" r="5" class="spitze">
      <animate attributeName="cy" values="648;122" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.1;.85;1" dur="4s" repeatCount="indefinite"/>
    </circle>
  </g>

  
  <text x="40" y="116" class="m">Steuerung</text>
  <rect x="40" y="128" width="180" height="96" rx="12" class="haupt" data-teil="inhaber"/>
  <text x="58" y="156" class="t">Inhaber</text>
  <text x="58" y="178" class="s">hat immer Vorrang</text>
  <text x="58" y="200" class="m">die KI hält 4 Runden still</text>

  <rect x="40" y="238" width="180" height="130" rx="12" class="card" data-teil="ki-master"/>
  <text x="58" y="266" class="t">KI-Master</text>
  <text x="58" y="288" class="s">liest jede Ebene</text>
  <text x="58" y="308" class="m">Übergabe A ↔ B</text>
  <text x="58" y="326" class="m">Not-Aus · spielt mit</text>
  <text x="58" y="352" class="f">Kapitel 7</text>

  <rect x="40" y="382" width="180" height="110" rx="12" class="card" data-teil="wachhund"/>
  <text x="58" y="410" class="t">Wachhund</text>
  <text x="58" y="432" class="s">startet nur, was weg ist</text>
  <text x="58" y="452" class="m">Stationen · Radio · Bridge</text>
  <text x="58" y="474" class="m">nie ein Unterbruch</text>

  <path d="M220,176 H236 V620" class="p"/>
  <path d="M220,303 H236" class="p"/>
  <path d="M220,437 H236" class="p"/>
