  <rect x="810" y="580" width="6" height="4" rx="1.5" class="klein"/>

  
  <rect x="250" y="600" width="630" height="54" rx="10" class="card" data-teil="spieler"/>
  <circle cx="302" cy="627" r="12" class="nr"/><text x="302" y="631" text-anchor="middle" class="nrT">8</text>
  <text x="326" y="623" class="t">Spieler</text>
  <text x="326" y="642" class="m">Browser · Android · DAW mit Plugin · KI · Simulation</text>
