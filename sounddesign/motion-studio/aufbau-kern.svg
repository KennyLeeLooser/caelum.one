<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 660" font-family="Inter, 'Segoe UI', Arial, sans-serif" role="img" aria-labelledby="titel beschr">
  <title id="titel">Caelum Motion Studio – ein Audio-Kern, drei Plattformen</title>
  <desc id="beschr">Die DSP-Engine wird einmal in C++ geschrieben: Effekte, EQ, 808-Drums, Clock, Mapping und Looper. Sie läuft identisch als Android-App, als VST3-Plugin und im Browser. Ein Null-Test prüft, dass alle drei Plattformen Sample für Sample gleich klingen.</desc>
  <defs>
    <style>
      .bg { fill: #262624; }
      .card { fill: #30302E; stroke: #3D3D3A; stroke-width: 1.5; }
      .well { fill: #1F1E1D; stroke: #3D3D3A; stroke-width: 1.5; }
      .haupt { fill: #30302E; stroke: #C8479A; stroke-width: 2.5; }
      .chip { fill: #1F1E1D; stroke: #3D3D3A; stroke-width: 1.2; }
      .chipG { stroke-dasharray: 4 3; stroke: #6E6C66; }
      .h { fill: #E8E6E1; font-size: 26px; font-weight: 600; }
      .sub { fill: #9C9A94; font-size: 15px; }
      .tg { fill: #E8E6E1; font-size: 21px; font-weight: 600; }
      .t { fill: #E8E6E1; font-size: 17px; font-weight: 600; }
      .s { fill: #C9C6BF; font-size: 13.5px; }
      .c { fill: #C9C6BF; font-size: 12.5px; }
      .m { fill: #9C9A94; font-size: 12px; }
      .f { fill: #6E6C66; font-size: 11.5px; }
      .labA { fill: #C8479A; font-size: 12px; font-weight: 600; }
      .okT { fill: #6BAF73; font-size: 13px; font-weight: 600; }
      .ok { fill: #6BAF73; }
      .okL { fill: none; stroke: #6BAF73; stroke-width: 2; stroke-linecap: round; }
      .nr { fill: #C8479A; }
      .nrT { fill: #FFFFFF; font-size: 13px; font-weight: 700; }
      .ic { fill: none; stroke: #C9C6BF; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
      .p { fill: none; stroke: #C9C6BF; stroke-width: 2; stroke-linecap: round; }
      .pA { fill: none; stroke: #C8479A; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .gl { fill: none; stroke: #6BAF73; stroke-width: 1.8; stroke-dasharray: 4 4; }
      .ende { fill: #C9C6BF; }
      .endeA { fill: #C8479A; }
      .welle { fill: none; stroke: #C8479A; stroke-width: 2; stroke-linecap: round; }
      .wellenbett { fill: #1F1E1D; stroke: #3D3D3A; stroke-width: 1; }
      .puls { fill: #C8479A; }
      .lauf { animation: kern-lauf 1.6s linear infinite; }
      .atem { animation: kern-atem 4s ease-in-out infinite; }
      @keyframes kern-lauf { to { transform: translateX(-40px); } }
      @keyframes kern-atem { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: .45; } }
      @media (prefers-reduced-motion: reduce) { .bewegt { display: none; } .lauf, .atem { animation: none; } }
      @media (prefers-color-scheme: light) {
        .bg { fill: #FAF9F6; }
        .card, .haupt { fill: #FFFFFF; }
        .card { stroke: #D9D6CF; }
        .haupt, .pA, .welle { stroke: #B03A85; }
        .well, .chip, .wellenbett { fill: #F0EEE9; stroke: #D9D6CF; }
        .chipG { stroke: #8A877F; }
        .h, .tg, .t { fill: #1F1E1D; }
        .s, .c { fill: #3D3D3A; }
        .sub, .m { fill: #5F5D58; }
        .f { fill: #8A877F; }
        .labA, .nr, .puls, .endeA { fill: #B03A85; }
        .okT, .ok { fill: #3F8A4A; }
        .gl, .okL { stroke: #3F8A4A; }
        .ic, .p { stroke: #3D3D3A; }
        .ende { fill: #3D3D3A; }
      }
    </style>
    <path id="welle" d="M0,0 q10,-10 20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0 t20,0"/>
    <clipPath id="fenster1"><rect x="58" y="442" width="304" height="26" rx="6"/></clipPath>
    <clipPath id="fenster2"><rect x="448" y="442" width="304" height="26" rx="6"/></clipPath>
    <clipPath id="fenster3"><rect x="838" y="442" width="304" height="26" rx="6"/></clipPath>
  </defs>

  <rect width="1200" height="660" rx="16" class="bg"/>
  <text x="40" y="54" class="h">Ein Audio-Kern, drei Plattformen</text>
  <text x="40" y="80" class="sub">Die DSP-Engine wird einmal in C++ geschrieben und klingt identisch als App, als Plugin und im Browser.</text>

  
  <rect x="40" y="124" width="170" height="104" rx="12" class="card" data-teil="referenz"/>
  <text x="56" y="152" class="t">Referenz</text>
  <text x="56" y="176" class="s">DSP der Android-App</text>
  <text x="56" y="196" class="m">Sample für Sample</text>
  <text x="56" y="213" class="m">nach C++ portiert</text>
  <path d="M212,176 H242" class="p"/><circle cx="245" cy="176" r="3" class="ende"/>

  
  <rect x="250" y="110" width="700" height="150" rx="12" class="haupt atem" data-teil="audio-kern"/>
  <text x="270" y="144" class="tg">Audio-Kern</text>
  <text x="270" y="166" class="m">C++ · echtzeitsicher · ohne Fremd-Bibliotheken</text>
  <text x="930" y="144" text-anchor="end" class="m">Stereo-Blockverarbeitung</text>
  <text x="930" y="166" text-anchor="end" class="m">gestrichelt = geplant</text>
  <g>
    <rect x="268" y="184" width="90" height="32" rx="8" class="chip" data-teil="effekte"/>
    <text x="313" y="205" text-anchor="middle" class="c">20 Effekte</text>
    <rect x="366" y="184" width="104" height="32" rx="8" class="chip" data-teil="eq"/>
    <text x="418" y="205" text-anchor="middle" class="c">EQ · 8 Bänder</text>
    <rect x="478" y="184" width="118" height="32" rx="8" class="chip" data-teil="drums-808"/>
    <text x="537" y="205" text-anchor="middle" class="c">808 · 16 Voices</text>
    <rect x="604" y="184" width="100" height="32" rx="8" class="chip chipG" data-teil="clock"/>
    <text x="654" y="205" text-anchor="middle" class="c">Clock · Swing</text>
    <rect x="712" y="184" width="132" height="32" rx="8" class="chip chipG" data-teil="mapping"/>
    <text x="778" y="205" text-anchor="middle" class="c">Mapping · Smoothing</text>
    <rect x="852" y="184" width="78" height="32" rx="8" class="chip" data-teil="looper"/>
    <text x="891" y="205" text-anchor="middle" class="c">Looper</text>
  </g>
  <text x="270" y="243" class="m">keine Speicher-Allokation im Audio-Thread · Parameter als ID und Wert · eine Codebasis für alle</text>

  
  <rect x="990" y="124" width="170" height="104" rx="12" class="card" data-teil="validierung"/>
  <text x="1006" y="152" class="t">Validierung</text>
  <circle cx="1011" cy="172" r="4.5" class="ok"/>
  <text x="1022" y="177" class="okT">87/87 Tests grün</text>
  <text x="1006" y="196" class="m">Referenz ↔ C++ bitgleich</text>
  <text x="1006" y="213" class="m">136 µs je Block (Java 204)</text>
  <path d="M952,176 H982" class="p"/><circle cx="985" cy="176" r="3" class="ende"/>

  
  <path d="M330,262 V292 H210 V322" class="pA"/><circle cx="210" cy="325" r="3.5" class="endeA"/>
  <path d="M600,262 V322" class="pA"/><circle cx="600" cy="325" r="3.5" class="endeA"/>
  <path d="M870,262 V292 H990 V322" class="pA"/><circle cx="990" cy="325" r="3.5" class="endeA"/>
  <text x="222" y="316" class="labA">JNI</text>
  <text x="612" y="300" class="labA">JUCE, nur als Wrapper</text>
  <text x="978" y="316" text-anchor="end" class="labA">WebAssembly + AudioWorklet</text>

  
  <rect x="40" y="330" width="340" height="150" rx="12" class="card" data-teil="android"/>
  <circle cx="64" cy="358" r="13" class="nr"/><text x="64" y="363" text-anchor="middle" class="nrT">1</text>
  <text x="88" y="364" class="t">Android-App</text>
  <rect x="344" y="346" width="18" height="30" rx="4" class="ic"/>
  <text x="58" y="392" class="s">Systemweite Effekte für alle Apps</text>
  <text x="58" y="412" class="s">Looper · Sequencer · Drums</text>
  <text x="58" y="432" class="m">Kern läuft · bitgleich, schneller als Java</text>
  <rect x="58" y="442" width="304" height="26" rx="6" class="wellenbett"/>
  <g clip-path="url(#fenster1)"><use href="#welle" xlink:href="#welle" x="58" y="455" class="welle lauf"/></g>

  
  <rect x="430" y="330" width="340" height="150" rx="12" class="card" data-teil="vst3"/>
  <circle cx="454" cy="358" r="13" class="nr"/><text x="454" y="363" text-anchor="middle" class="nrT">2</text>
  <text x="478" y="364" class="t">VST3-Plugin</text>
  <circle cx="742" cy="361" r="13" class="ic"/>
  <line x1="742" y1="361" x2="749" y2="352" class="ic"/>
  <text x="448" y="392" class="s">Ableton Live und jede VST3-DAW</text>
  <text x="448" y="412" class="s">16 Makros · Clock · OSC</text>
  <text x="448" y="432" class="m">läuft in Ableton Live 12</text>
  <rect x="448" y="442" width="304" height="26" rx="6" class="wellenbett"/>
  <g clip-path="url(#fenster2)"><use href="#welle" xlink:href="#welle" x="448" y="455" class="welle lauf"/></g>

  
  <rect x="820" y="330" width="340" height="150" rx="12" class="card" data-teil="browser"/>
  <circle cx="844" cy="358" r="13" class="nr"/><text x="844" y="363" text-anchor="middle" class="nrT">3</text>
  <text x="868" y="364" class="t">Browser</text>
  <rect x="1116" y="349" width="28" height="22" rx="3" class="ic"/>
  <line x1="1116" y1="355" x2="1144" y2="355" class="ic"/>
  <text x="838" y="392" class="s">Jam-Client ohne Installation</text>
  <text x="838" y="412" class="s">Smartphone als Controller</text>
  <text x="838" y="432" class="m">Kern als WebAssembly geplant</text>
  <rect x="838" y="442" width="304" height="26" rx="6" class="wellenbett"/>
  <g clip-path="url(#fenster3)"><use href="#welle" xlink:href="#welle" x="838" y="455" class="welle lauf"/></g>

  
  <path d="M210,482 V512" class="gl"/>
  <path d="M600,482 V512" class="gl"/>
  <path d="M990,482 V512" class="gl"/>
  <rect x="40" y="512" width="1120" height="74" rx="12" class="well" data-teil="null-test"/>
  <circle cx="62" cy="539" r="5" class="ok"/>
  <text x="76" y="544" class="okT">Null-Test</text>
  <text x="160" y="544" class="s">Gleiches Eingangssignal → gleiches Ausgangssignal auf allen drei Plattformen.</text>
  <text x="76" y="568" class="m">Heute: Effekte, EQ und 808 Referenz ↔ C++ bitgleich, Hörprobe in allen 21 Abschnitten identisch.</text>
  <text x="1004" y="544" class="m">A − B</text>
  <line x1="1046" y1="540" x2="1136" y2="540" class="okL"/>
  <text x="1136" y="568" text-anchor="end" class="okT">Differenz 0</text>

  <text x="40" y="618" class="m">Fundament selbst gebaut: JUCE nur als VST3-Wrapper, auf Android direkt über JNI. Die DAW ist optional.</text>
  <text x="40" y="640" class="f">Entwurf 24.11.2026 · Caelum GmbH</text>

  
  <g class="bewegt">
    <circle r="4.5" class="puls" opacity="0">
      <animateMotion path="M330,262 V292 H210 V320" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.29;0.3;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" class="puls" opacity="0">
      <animateMotion path="M600,262 V320" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.29;0.3;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle r="4.5" class="puls" opacity="0">
      <animateMotion path="M870,262 V292 H990 V320" dur="4s" begin="0s" repeatCount="indefinite" calcMode="linear" keyPoints="0;1;1" keyTimes="0;0.3;1"/>
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.29;0.3;1" dur="4s" begin="0s" repeatCount="indefinite"/>
    </circle>
  </g>
