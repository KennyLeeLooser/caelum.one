<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1F1E1D">
<title>Caelum Rorschach · Überraschung</title>
<style>
:root{ --deep:#1F1E1D; --bg:#262624; --line:#3D3D3A; --text:#E8E6E1; --soft:#C9C6BF; --muted:#9C9A94; --accent:#D97757; --prog:#6B74F0; /* Programmfarbe A8, CAELUM/Branding/farben.json */
  --ui:"Inter","Segoe UI",system-ui,sans-serif; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep);color:var(--text);font:15px/1.45 var(--ui);overflow:hidden;touch-action:none}
#bild{position:fixed;inset:0;width:100%;height:100%;display:block}
.oben{position:fixed;top:0;left:0;right:0;padding:max(14px,env(safe-area-inset-top)) 16px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;pointer-events:none}
.marke{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.marke svg{width:22px;height:22px}.marke b{color:var(--prog);font-weight:600}
#zurueck{pointer-events:auto;color:var(--muted);font-size:13px;text-decoration:none}
.unten{position:fixed;left:0;right:0;bottom:0;padding:0 16px max(18px,env(safe-area-inset-bottom));display:grid;justify-items:center;gap:10px;text-align:center;pointer-events:none}
#botschaft{font-size:clamp(22px,6.4vw,34px);font-weight:600;line-height:1.2;max-width:22ch;opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s;text-wrap:balance}
#objektname{color:var(--muted);font-size:13px;opacity:0;transition:opacity .8s .2s}
.zeigen #botschaft{opacity:1;transform:none}.zeigen #objektname{opacity:1}
#nochmal{pointer-events:auto;font:600 14px var(--ui);color:var(--deep);background:var(--accent);border:0;border-radius:10px;padding:10px 18px;opacity:0;transition:opacity .6s .6s}
.zeigen #nochmal{opacity:1}
#fehler{position:fixed;inset:0;display:none;place-items:center;padding:24px;text-align:center}
#fehler.an{display:grid}#fehler h1{font-size:20px;margin:0 0 8px}#fehler p{color:var(--muted);margin:0}
.leise{color:var(--muted);font-size:12px}
</style></head>
<body>
<canvas id="bild" aria-label="Überraschung in 3D"></canvas>
<div class="oben"><div class="marke"><svg id="markeLogo" viewBox="44 44 936 936" aria-hidden="true"><path fill="#E8E6E1" fill-rule="evenodd"></path></svg>Caelum <b>Rorschach</b></div>
  <a id="zurueck" href="index.html" hidden>← Erzeuger</a></div>
<div class="unten">
  <div id="botschaft" aria-live="polite"></div>
  <div id="objektname"></div>
  <button id="nochmal" type="button">Nochmal</button>
  <div class="leise">Der Befehl bleibt auf diesem Gerät.</div>
</div>
<div id="fehler"><div><h1 id="fehlerTitel">Kein Rorschach-Code</h1><p id="fehlerText"></p></div></div>
<script type="module" src="scan.js"></script>
</body></html>
